<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a9d4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>미지의 대륙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="touch"></div>

  <div id="stats" class="hud">
    <div class="row"><span id="lvl">탐험가 Lv.1</span><span id="area">0.00 km²</span></div>
    <div class="bar"><i id="xpbar"></i></div>
    <div id="xptxt">0 / 100 XP</div>
  </div>
  <div id="place" class="hud"><b id="placeName">—</b><small id="placeBiome"></small></div>
  <button id="mapBtn" class="hud" aria-label="지도 열기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
  </button>
  <div id="toast" class="hud"><div class="k" id="toastK"></div><div class="t" id="toastT"></div><div class="x" id="toastX"></div></div>
  <div id="joy" class="hud"><div id="knob"></div></div>
  <button id="runBtn" class="hud act-btn" aria-pressed="false">달리기</button>
  <button id="jumpBtn" class="hud act-btn">점프</button>

  <div id="map" hidden>
    <canvas id="mapCv"></canvas>
    <div id="mapTop">
      <div><h2>탐험 지도</h2><p id="mapStat"></p></div>
      <button id="closeMap">닫기</button>
    </div>
    <div id="legend"></div>
    <div class="mbtns">
      <button class="mb" id="zin" aria-label="확대">+</button>
      <button class="mb" id="zout" aria-label="축소">−</button>
      <button class="mb" id="zme" aria-label="내 위치">◎</button>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <div class="eyebrow">끝없이 펼쳐진 세계</div>
      <h1>미지의 대륙</h1>
      <p>숲과 밀림, 사막과 설산, 강과 바다. 걸어간 만큼 지도가 밝혀지고, 밝힌 땅만큼 성장합니다.</p>
      <ul>
        <li>화면 왼쪽 드래그 · 이동</li>
        <li>화면 오른쪽 드래그 · 시점 회전</li>
        <li>키보드: WASD · Shift 달리기 · Space 점프 · M 지도</li>
      </ul>
      <button class="go" id="goNew">탐험 시작</button>
      <button class="go" id="goCont" hidden>이어서 탐험</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
